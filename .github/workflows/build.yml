name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -o build/camera-feed.exe ./src

      - uses: actions/upload-artifact@v4
        with:
          name: camera-feed
          path: build/camera-feed.exe
